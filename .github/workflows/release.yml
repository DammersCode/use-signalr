name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships older.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: node scripts/check-docs.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:dist

      # A mistyped tag must fail here, not publish the wrong version.
      - name: Verify tag matches versions
        run: |
          TAG=${GITHUB_REF_NAME#v}
          ROOT=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$ROOT" ]; then
            echo "Tag v$TAG does not match root package.json $ROOT"
            exit 1
          fi
          for PKG in core react solid svelte angular vue preact lit; do
            V=$(node -p "require('./packages/$PKG/package.json').version")
            if [ "$TAG" != "$V" ]; then
              echo "Tag v$TAG does not match packages/$PKG/package.json $V"
              exit 1
            fi
          done

      # No token: npm authenticates via OIDC trusted publishing, configured
      # per package on npmjs.com.
      - run: npm publish -w packages/core --provenance
      - run: npm publish -w packages/react --provenance
      - run: npm publish -w packages/solid --provenance
      - run: npm publish -w packages/svelte --provenance
      - run: npm publish -w packages/angular --provenance
      - run: npm publish -w packages/vue --provenance
      - run: npm publish -w packages/preact --provenance
      - run: npm publish -w packages/lit --provenance

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
